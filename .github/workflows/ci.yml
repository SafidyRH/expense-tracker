name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test-and-build:
    name: Test and Build

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_USER: expense_test_user
          POSTGRES_PASSWORD: expense_test_password
          POSTGRES_DB: expense_tracker_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U expense_test_user -d expense_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test

      DATABASE_URL: postgresql://expense_test_user:expense_test_password@localhost:5432/expense_tracker_test?schema=public

      BETTER_AUTH_URL: http://localhost:3030
      BETTER_AUTH_SECRET: ci-only-expense-tracker-secret-12345678901234567890

      FRONTEND_URL: http://localhost:3000

      NEXT_PUBLIC_API_URL: http://localhost:3030

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm -C ./packages/database exec prisma generate

      - name: Lint frontend
        run: pnpm lint:web

      - name: Typecheck API
        run: pnpm typecheck:api

      - name: Typecheck frontend
        run: pnpm typecheck:web

      - name: Run unit tests
        run: pnpm test:api:unit

      - name: Apply Prisma migrations to test database
        run: pnpm -C ./packages/database exec prisma migrate deploy

      - name: Run integration tests
        run: pnpm test:api:integration

      - name: Build frontend
        env:
          NODE_ENV: production
        run: pnpm build:web
