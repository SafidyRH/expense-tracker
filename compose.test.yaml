services:
  postgres-test:
    image: postgres:18-alpine

    container_name: expense-tracker-postgres-test

    environment:
      POSTGRES_USER: expense_test_user
      POSTGRES_PASSWORD: expense_test_password
      POSTGRES_DB: expense_tracker_test

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U expense_test_user -d expense_tracker_test"
        ]

      interval: 2s
      timeout: 5s
      retries: 15